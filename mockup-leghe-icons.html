  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; max-width: 900px; }

  .chip svg, .plain svg { width: 22px; height: 22px; }
  .plain { display: inline-flex; width: 40px; height: 40px; align-items: center; justify-content: center; color: #22181a; margin-left: 4px; }
