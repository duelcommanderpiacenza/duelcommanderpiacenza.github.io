    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("nav-mobile");
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("app-header");
      } catch (e) {}
    })();

    <!-- The league's Wrapped as a hero, like player.html's (styles.css
         .profile-hero, .league-hero): on the blurred art of the league's most
         played commander, the name, its status and dates, the numbers
         (js/league-detail.js); "‹ Leghe & Eventi" on its top
         edge (.detail-hero-wrap). -->
    <div class="detail-hero-wrap">
      <a class="detail-hero-back" href="events.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Leghe <span class="amp">&amp;</span> Eventi</a>

        <div class="profile-hero-art" id="league-hero-art" aria-hidden="true"></div>
        <div class="profile-hero-inner">
          <div class="profile-hero-text">
            <div class="profile-hero-heading">
              <h1 class="profile-hero-name" id="league-title">Caricamento...</h1>
              <div class="league-hero-meta">
                <span id="league-status" hidden></span>
                <span id="league-dates" hidden></span>
              </div>
            </div>
            <!-- The numbers, then the hero's buttons: "Recap" (a closed
                 league's season in stories, js/event-recap.js) and
                 "Regolamento" (how the standings are scored, js/league-rules.js;
                 white beside "Recap") — on a computer at the right end of the
                 numbers' line, up to 820px above them, centred; none for a
                 Topdeck series (no standings). -->
            <div class="profile-hero-stats">
              <div class="profile-stats-tiles" id="league-stats"></div>
              <div class="hero-actions" id="league-actions" hidden>
                <button type="button" class="league-rules-btn" id="league-recap" aria-haspopup="dialog" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"></path></svg>Recap</button>
                <button type="button" class="league-rules-btn" id="league-rules" aria-haspopup="dialog" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>Regolamento<svg class="league-rules-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
              </div>
            </div>
          </div>

    <!-- Phones / tablets: the page's content as a sheet sliding up over the hero (styles.css .hero-sheet; on a computer it's no box at all). -->
    <div class="hero-sheet">

    <!-- Eventi della lega (a timeline), Classifica and Meta: one at a time
         behind tabs on every screen, like event.html's (a pill bar on a
         computer, the sticky segmented control on touch screens; no
         titles — the tab names the panel). A Topdeck series has no
         Classifica: that tab hidden (js/league-detail.js). -->
    <nav class="profile-tabs league-tabs" role="tablist" aria-label="Sezioni della lega">
      <button type="button" class="profile-tab" role="tab" id="league-tab-events" data-tab="league-events-section" aria-controls="league-events-section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg><span>Eventi</span></button>
      <button type="button" class="profile-tab" role="tab" id="league-tab-leaderboard" data-tab="league-leaderboard-section" aria-controls="league-leaderboard-section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0Z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg><span>Classifica</span></button>
      <button type="button" class="profile-tab" role="tab" id="league-tab-meta" data-tab="league-meta-section" aria-controls="league-meta-section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9Z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15Z"></path></svg><span>Meta</span></button>
    </nav>
    <div class="league-lists">

      </section>

      <section id="league-leaderboard-section" role="tabpanel" aria-labelledby="league-tab-leaderboard">

      <!-- Meta: the league's commanders and archetypes, over all its played
           events — event.html's Meta charts (js/meta-charts.js). -->
      <section id="league-meta-section" role="tabpanel" aria-labelledby="league-tab-meta">
        <div class="card dashboard-card dashboard-card-commanders event-meta-card" id="league-meta-card">
          <div id="league-meta-charts" class="page-loading">Caricamento...</div>
