<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("nav-mobile");
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("app-header");
      } catch (e) {}
    })();
  </script>
  <title>Lega - Duel Commander Piacenza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="dc_pc.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#120d0e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-active-nav="events" class="is-loading">

<header class="site-header">
  <div class="site-header-inner">
    <a class="site-header-brand" href="index.html">
      <img src="dc_pc.png" alt="" class="site-logo-sm">
      <span>Duel Commander Piacenza</span>
    </a>

    <button type="button" class="site-news" id="site-news" aria-label="Novit&agrave;" title="Novit&agrave;" aria-haspopup="dialog">
      <svg class="site-news-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span class="site-news-badge" hidden></span>
    </button>

    <div class="site-search">
      <button type="button" class="site-search-trigger" id="site-search-trigger" aria-label="Cerca" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>

      <div class="site-search-box" id="site-search-box">
        <div class="site-search-bar">
          <div class="site-search-field">
            <svg class="site-search-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" id="site-search-input" class="site-search-input" placeholder="Cerca giocatori, eventi, &hellip;" aria-label="Cerca nel sito" autocomplete="off">
          </div>
          <button type="button" class="site-search-close" id="site-search-close" aria-label="Chiudi ricerca">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>
          </button>
        </div>
        <div class="site-search-results" id="site-search-results"></div>
      </div>
    </div>

    <a class="site-account" id="site-account" href="account.html" aria-label="Accedi" title="Accedi">
      <svg class="site-account-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
    </a>
  </div>
</header>

<nav class="site-nav" aria-label="Navigazione principale">
  <button type="button" class="nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false"><span class="nav-dropdown-label">Leghe <span class="amp">&amp;</span> Eventi</span><span class="nav-dropdown-caret" aria-hidden="true"></span></button>
  <div class="site-nav-inner">
    <a class="nav-link" data-nav="current" href="index.html">Bacheca</a>
    <a class="nav-link" data-nav="events" href="events.html">Leghe <span class="amp">&amp;</span> Eventi</a>
    <a class="nav-link" data-nav="meta" href="commanders.html">Meta</a>
    <a class="nav-link" data-nav="players" href="players.html">Giocatori</a>
    <a class="nav-link" data-nav="social" href="social.html">Social</a>
  </div>
</nav>

<main class="page-main" id="league-content" data-accent-from-hero data-page="league">
  <div class="page-loading-region">
    <div id="page-loading-overlay" class="page-loading-overlay">
      <div class="sk-page is-hero" aria-hidden="true">
        <div class="sk sk-hero"><div class="sk-hero-text"><i class="sk-hero-title"></i><i class="sk-hero-line"></i><div class="sk-hero-chips"><i></i><i></i><i></i></div></div></div>
        <i class="sk sk-tabs sk-touch-only"></i>
        <div class="sk-cols">
          <div class="sk-col">
            <i class="sk sk-title"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
          </div>
          <div class="sk-col">
            <i class="sk sk-title"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
          </div>
        </div>
      </div>
      <p>Caricamento...</p>
    </div>

    <!-- The league's Wrapped as a hero, like player.html's (styles.css
         .profile-hero, .league-hero): on the blurred art of the league's most
         played commander, the name, its status and dates, the numbers
         (js/league-detail.js); "‹ Leghe & Eventi" on its top
         edge (.detail-hero-wrap). -->
    <div class="detail-hero-wrap">
      <a class="detail-hero-back" href="events.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Leghe <span class="amp">&amp;</span> Eventi</a>
      <section class="profile-hero detail-hero league-hero is-no-card" id="league-hero">
        <div class="profile-hero-art" id="league-hero-art" aria-hidden="true"></div>
        <div class="profile-hero-inner">
          <div class="profile-hero-text">
            <div class="profile-hero-heading">
              <h1 class="profile-hero-name" id="league-title">Caricamento...</h1>
              <div class="league-hero-meta">
                <span id="league-status" hidden></span>
                <span id="league-dates" hidden></span>
              </div>
            </div>
            <div class="profile-hero-stats">
              <div class="profile-stats-tiles" id="league-stats"></div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Eventi della lega (a timeline) and Classifica: side by side on a
         computer, one under the other when narrow; on phones and touch
         screens (html.app-header) one at a time behind tabs, like
         commander.html's (styles.css .league-lists; no tabs for a Topdeck
         series — no Classifica, js/league-detail.js). -->
    <nav class="profile-tabs league-tabs" role="tablist" aria-label="Sezioni della lega">
      <button type="button" class="profile-tab" role="tab" id="league-tab-events" data-tab="league-events-section" aria-controls="league-events-section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg><span>Eventi</span></button>
      <button type="button" class="profile-tab" role="tab" id="league-tab-leaderboard" data-tab="league-leaderboard-section" aria-controls="league-leaderboard-section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0Z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg><span>Classifica</span></button>
    </nav>
    <div class="league-lists">
      <section id="league-events-section" role="tabpanel" aria-labelledby="league-tab-events">
        <h2>Eventi della lega</h2>
        <div id="league-events" class="page-loading">Caricamento...</div>
      </section>

      <section id="league-leaderboard-section" role="tabpanel" aria-labelledby="league-tab-leaderboard">
        <!-- How the standings are scored: the "?" after the title on a
             computer; on touch screens (no titles there, the tab names the
             panel) the same "?" alone, on the right above the list. Both
             open the shared pop-up with #league-help-text
             (js/league-detail.js). -->
        <h2 class="heading-help">Classifica <button type="button" class="help-toggle-btn" data-league-help aria-haspopup="dialog" aria-label="Come si calcola la classifica">?</button></h2>
        <button type="button" class="help-toggle-btn league-help-touch" data-league-help aria-haspopup="dialog" aria-label="Come si calcola la classifica">?</button>
        <div id="league-leaderboard" class="page-loading">Caricamento...</div>
      </section>
    </div>
  </div>
  <!-- The "?" pop-up's text (LEAGUE_RULES.md, simplified for players). -->
  <template id="league-help-text">
    <h4>Ogni evento</h4>
    <p>Si gioca a punti partita (vittoria 3, pareggio 1, sconfitta 0; il bye vale una vittoria). La posizione finale vale punti lega:</p>
    <dl class="league-help-points">
      <div><dt>1°</dt><dd>20</dd></div>
      <div><dt>2°</dt><dd>17</dd></div>
      <div><dt>3°–4°</dt><dd>14</dd></div>
      <div><dt>5°–8°</dt><dd>11</dd></div>
      <div><dt>dal 9°</dt><dd>5</dd></div>
    </dl>
    <p><strong>+2</strong> a chi chiude l&rsquo;evento imbattuto.</p>
    <h4>Il peggiore non conta</h4>
    <p>Il tuo risultato peggiore della lega viene scartato: anche con una giornata storta resti in corsa per la classifica.</p>
    <h4>Presenza completa</h4>
    <p><strong>+5</strong> a chi ha giocato tutti gli eventi, assegnati quando la lega è conclusa.</p>
  </template>
</main>

  <div class="footer-spacer" aria-hidden="true"></div>
  <div class="footer-center">
    <div>&copy; 2026 Duel Commander Piacenza</div>

      <a href="https://www.instagram.com/michele__f/" target="_blank" rel="noopener noreferrer" aria-label="Instagram di Michele Ferri">
        <img src="instagram.png" alt="Instagram" width="16" height="16">
      </a>
    </div>
  </div>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Cambia tema"></button>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/layout.js"></script>

</body>
</html>
