<!DOCTYPE html>
<html lang="it">
<head>
  <!-- shell:head (partials/head.html — scripts/sync-shell.py) -->
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("nav-mobile");
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("app-header");
      } catch (e) {}
    })();
  </script>
  <!-- The stylesheet, in six parts loaded in this order (css/). -->
  <link rel="stylesheet" href="css/1-base-header-home.css">
  <link rel="stylesheet" href="css/2-pages-heroes-events.css">
  <link rel="stylesheet" href="css/3-lists-badges-league.css">

  <link rel="stylesheet" href="css/5-card-matchups-charts.css">
  <link rel="stylesheet" href="css/6-dark-tabbar-transitions.css">
  <!-- /shell:head -->

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#120d0e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>

    <div class="site-search">

            <input type="search" id="site-search-input" class="site-search-input" placeholder="Cerca giocatori, eventi, &hellip;" aria-label="Cerca nel sito" autocomplete="off">

<main class="page-main" data-page="players">
  <!-- No visible title (the nav names the page): for screen readers. -->
  <div class="page-heading visually-hidden">
    <h1>Giocatori</h1>
  </div>

  <div class="page-loading-region">
    <div id="page-loading-overlay" class="page-loading-overlay">
      <div class="sk-page is-list" aria-hidden="true">
        <i class="sk sk-search"></i>
        <i class="sk sk-row"></i>
        <i class="sk sk-row"></i>
        <i class="sk sk-row"></i>
        <i class="sk sk-row"></i>
        <i class="sk sk-row"></i>

        <i class="sk sk-row"></i>
        <i class="sk sk-row"></i>
      </div>

    </div>

    <!-- Search, sort and the filters' button, the filters' panel under
         them — shown with the list once the page has loaded (inside the
         loading region). -->
    <div class="filter-toggle-line">
      <div class="field filter-toggle-search">
        <label for="players-search">Cerca</label>
        <input type="search" id="players-search" placeholder="Cerca giocatore...">
      </div>
      <div class="field filter-toggle-sort">
        <label for="players-sort">Ordina per</label>
        <select id="players-sort">
          <option value="events">Eventi</option>
          <option value="winrate">Winrate</option>
          <option value="wins">Vittorie</option>
        </select>
      </div>
      <button type="button" class="filter-toggle-btn" id="players-filter-toggle" aria-expanded="false" aria-controls="players-filter-panel" aria-label="Filtri">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
      </button>
    </div>
    <div class="filter-panel is-collapsed" id="players-filter-panel">
      <div class="filter-panel-clip">
        <div class="filter-panel-body">
          <div class="filter-bar">
            <div class="field">
              <label for="players-league-filter">Lega</label>
              <select id="players-league-filter"><option value="">Tutte le leghe</option></select>
            </div>
            <div class="field">
              <label for="players-event-filter">Evento</label>
              <select id="players-event-filter"><option value="">Tutti gli eventi</option></select>
            </div>
            <div class="field">
              <label for="players-date-from">Dal</label>
              <input type="date" id="players-date-from" placeholder="Dal" data-open-on-today>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="players-list">
      <p class="page-loading">Caricamento giocatori...</p>
    </div>
  </div>
