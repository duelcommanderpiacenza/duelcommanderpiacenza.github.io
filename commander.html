<!DOCTYPE html>

  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        if (window.matchMedia("(max-width: 640px) and (pointer: coarse) and (hover: none)").matches) document.documentElement.classList.add("nav-mobile");
      } catch (e) {}
    })();
  </script>
