<!DOCTYPE html>
<html lang="it">
<head>
  <!-- shell:head (partials/head.html — scripts/sync-shell.py) -->
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("nav-mobile");
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("app-header");
      } catch (e) {}
    })();
  </script>
  <!-- The stylesheet, in six parts loaded in this order (css/). -->
  <link rel="stylesheet" href="css/1-base-header-home.css">
  <link rel="stylesheet" href="css/2-pages-heroes-events.css">
  <link rel="stylesheet" href="css/3-lists-badges-league.css">
  <link rel="stylesheet" href="css/4-profile-card.css">
  <link rel="stylesheet" href="css/5-card-matchups-charts.css">
  <link rel="stylesheet" href="css/6-dark-tabbar-transitions.css">
  <!-- /shell:head -->
  <title>Commander - Duel Commander Piacenza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
  <link rel="icon" type="image/svg+xml" href="dc_pc.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#120d0e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>

      <span>Duel Commander Piacenza</span>

    <button type="button" class="site-news" id="site-news" aria-label="Novit&agrave;" title="Novit&agrave;" aria-haspopup="dialog">
      <svg class="site-news-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span class="site-news-badge" hidden></span>
    </button>

    <div class="site-search">
      <button type="button" class="site-search-trigger" id="site-search-trigger" aria-label="Cerca" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>

      <div class="site-search-box" id="site-search-box">
        <div class="site-search-bar">
          <div class="site-search-field">
            <svg class="site-search-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" id="site-search-input" class="site-search-input" placeholder="Cerca giocatori, eventi, &hellip;" aria-label="Cerca nel sito" autocomplete="off">
          </div>
          <button type="button" class="site-search-close" id="site-search-close" aria-label="Chiudi ricerca">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>
          </button>

    <a class="site-account" id="site-account" href="account.html" aria-label="Accedi" title="Accedi">

<main class="page-main" id="commander-content" data-accent-from-hero data-page="commander">
  <div class="page-loading-region">
    <div id="page-loading-overlay" class="page-loading-overlay">
      <div class="sk-page is-hero" aria-hidden="true">
        <div class="sk sk-hero has-card"><i class="sk-hero-card"></i><div class="sk-hero-text"><i class="sk-hero-title"></i><div class="sk-hero-chips"><i></i><i></i><i></i></div></div></div>
        <i class="sk sk-chart"></i>
        <i class="sk sk-tabs sk-touch-only"></i>
        <div class="sk-cols">
          <div class="sk-col">
            <i class="sk sk-title"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
          </div>
          <div class="sk-col">
            <i class="sk sk-title"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
          </div>
        </div>
      </div>
      <p>Caricamento...</p>
    </div>

    <!-- The hero, like account.html's profile one (styles.css .profile-hero):
         the commander's card (Scryfall; the flip for a double-faced one) on
         the left — a card-shaped placeholder until it loads, the text the
         whole width without one — on the blurred art of the commander; the
         name and the numbers on the right (js/commander-detail.js). -->
    <!-- The hero, and "‹ back to the list" on its top edge (desktop:
         half on the hero, half on the page, over the card's column; phones:
         inside it at the top left) — outside the hero, which clips what's
         inside it. -->
    <div class="detail-hero-wrap">
      <a class="detail-hero-back" href="commanders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Comandanti</a>
      <section class="profile-hero detail-hero" id="commander-hero">
        <div class="profile-hero-art" id="commander-hero-art" aria-hidden="true"></div>
        <div class="profile-hero-inner">
          <div class="profile-card-col detail-hero-card" id="commander-card-col">
            <div class="commander-card-skeleton" id="commander-card-skeleton" aria-hidden="true"></div>
            <figure class="commander-card-figure" id="commander-card-figure" hidden>
              <div class="commander-card-perspective">
                <div class="commander-card-flipper" id="commander-card-flipper">
                  <img id="commander-card-image-front" class="commander-card-face commander-card-face-front" alt="">
                  <img id="commander-card-image-back" class="commander-card-face commander-card-face-back" alt="">
                </div>
              </div>
              <button type="button" class="commander-card-flip-btn" id="commander-card-flip-btn" hidden aria-label="Mostra l'altro lato della carta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="17 1 21 5 17 9"></polyline>
                  <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                  <polyline points="7 23 3 19 7 15"></polyline>
                  <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                </svg>
              </button>
            </figure>
            <!-- The partner's card, when a pairing is picked (js/commander-detail.js):
                 behind the commander's, a little to the right. -->
            <figure class="commander-partner-figure" id="commander-partner-figure" hidden>
              <img id="commander-partner-image" class="commander-card-face" alt="">
            </figure>
          </div>
          <div class="profile-hero-text">
            <div class="profile-hero-heading">
              <h1 class="profile-hero-name" id="commander-title">Caricamento...</h1>
            </div>
            <!-- Played with partners: which pairing the page shows — all of
                 them, alone, or with one partner (js/commander-detail.js). -->
            <div class="pairing-picker" id="commander-pairings" role="group" aria-label="Partner" hidden></div>
            <div class="profile-hero-stats">
              <div class="profile-stats-tiles" id="commander-winrate"></div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div id="commander-decks-chart" class="page-loading" style="margin-top:20px;">Caricamento...</div>

    <!-- Desktop: Giocatori left, Storico partite right, each as tall as its
         list — the matches scrolling past 8 rounds, the players never
         taller than the matches (scrolling past that) (js/history-list.js,
         styles.css .history-grid). Phones and touch screens
         (html.app-header): one at a time behind tabs, like event.html's,
         each list whole (styles.css .commander-lists). -->
    <nav class="profile-tabs commander-tabs" role="tablist" aria-label="Sezioni del comandante">
      <button type="button" class="profile-tab" role="tab" id="commander-tab-players" data-tab="commander-col-players" aria-controls="commander-col-players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>Giocatori</span></button>
      <button type="button" class="profile-tab" role="tab" id="commander-tab-matches" data-tab="commander-col-matches" aria-controls="commander-col-matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"></path><path d="m13 19 6-6M16 16l4 4M19 21l2-2"></path><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"></path><path d="m5 14 4 4M7 17l-3 3M3 19l2 2"></path></svg><span>Storico partite</span></button>
    </nav>
    <div class="history-grid commander-lists">
      <section class="history-col" id="commander-col-players" role="tabpanel" aria-labelledby="commander-tab-players">
        <h2>Giocatori <span class="history-count" id="commander-players-count"></span></h2>
        <div id="commander-players" class="page-loading">Caricamento...</div>
      </section>
      <section class="history-col" id="commander-col-matches" role="tabpanel" aria-labelledby="commander-tab-matches">
        <h2>Storico partite <span class="history-count" id="commander-matches-count"></span></h2>
        <div id="commander-matches" class="page-loading">Caricamento...</div>
      </section>
    </div>
  </div>
</main>
