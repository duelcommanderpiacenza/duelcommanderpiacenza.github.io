<!DOCTYPE html>
<html lang="it">
<head>
  <!-- shell:head (partials/head.html — scripts/sync-shell.py) -->
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("nav-mobile");
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("app-header");
      } catch (e) {}
    })();
  </script>
  <!-- The stylesheet, in six parts loaded in this order (css/). -->
  <link rel="stylesheet" href="css/1-base-header-home.css">
  <link rel="stylesheet" href="css/2-pages-heroes-events.css">
  <link rel="stylesheet" href="css/3-lists-badges-league.css">
  <link rel="stylesheet" href="css/4-profile-card.css">
  <link rel="stylesheet" href="css/5-card-matchups-charts.css">
  <link rel="stylesheet" href="css/6-dark-tabbar-transitions.css">
  <!-- /shell:head -->
  <title>Matchups - Duel Commander Piacenza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
  <link rel="icon" type="image/svg+xml" href="dc_pc.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#120d0e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body data-active-nav="meta" class="is-loading">

<!-- shell:header -->
<header class="site-header">
  <div class="site-header-inner">
    <a class="site-header-brand" href="index.html">
      <img src="dc_pc.svg" alt="" class="site-logo-sm">
      <span>Duel Commander Piacenza</span>
    </a>

    <button type="button" class="site-news" id="site-news" aria-label="Novit&agrave;" title="Novit&agrave;" aria-haspopup="dialog">
      <svg class="site-news-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span class="site-news-badge" hidden></span>
    </button>

    <div class="site-search">
      <button type="button" class="site-search-trigger" id="site-search-trigger" aria-label="Cerca" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>

      <div class="site-search-box" id="site-search-box">
        <div class="site-search-bar">
          <div class="site-search-field">
            <svg class="site-search-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" id="site-search-input" class="site-search-input" placeholder="Cerca giocatori, eventi, &hellip;" aria-label="Cerca nel sito" autocomplete="off">
          </div>
          <button type="button" class="site-search-close" id="site-search-close" aria-label="Chiudi ricerca">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>
          </button>
        </div>
        <div class="site-search-results" id="site-search-results"></div>
      </div>
    </div>

    <a class="site-account" id="site-account" href="account.html" aria-label="Accedi" title="Accedi">
      <svg class="site-account-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
    </a>
  </div>
</header>
<!-- /shell:header -->

<!-- shell:nav -->
<nav class="site-nav" aria-label="Navigazione principale">
  <div class="site-nav-inner">
    <a class="nav-link" data-nav="current" href="index.html">Bacheca</a>
    <a class="nav-link" data-nav="events" href="events.html">Leghe <span class="amp">&amp;</span> Eventi</a>
    <a class="nav-link" data-nav="meta" href="commanders.html">Meta</a>
    <a class="nav-link" data-nav="players" href="players.html">Giocatori</a>
    <a class="nav-link" data-nav="social" href="social.html">Social</a>
  </div>
</nav>
<!-- /shell:nav -->

<main class="page-main" data-page="matchups">
  <!-- The section's head: the sub-tabs with the filters' button — on a
       computer one line (the tabs centred, the button at the right end), on
       touch screens the sub-tabs' sticky row, the button on its top-right
       corner (styles.css .meta-head). -->
  <div class="meta-head">
    <div class="page-heading page-heading-with-action">
      <!-- No visible title (the nav and the sub-tabs name the page): its
           <h1> for screen readers only. -->
      <div class="page-heading-title-group">
        <h1>Matchups</h1>
        <button type="button" class="help-toggle-btn" id="matchups-help-toggle" data-matchups-help aria-haspopup="dialog" aria-label="Come si legge la matrice">?</button>
      </div>
    </div>
    <!-- Comandanti / Matchups / Archetipi — the nav's "Meta" (and the tab
         bar's, js/tab-bar.js) — in the site's segmented control (styles.css
         .meta-tabs), the filters' button beside it. -->
    <div class="meta-row">
      <nav class="profile-tabs meta-tabs" aria-label="Meta">
        <a class="profile-tab" href="commanders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="11" height="15" rx="2"></rect><path d="M6 6.5V19a2 2 0 0 0 2 2h8"></path></svg><span>Comandanti</span></a>
        <a class="profile-tab is-active" href="matchups.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"></path><path d="m13 19 6-6M16 16l4 4M19 21l2-2"></path><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"></path><path d="m5 14 4 4M7 17l-3 3M3 19l2 2"></path></svg><span>Matchups</span></a>
        <a class="profile-tab" href="archetypes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4"></circle><rect x="13" y="3" width="8" height="8" rx="1.5"></rect><path d="M7 13.5l4 7H3z"></path><circle cx="17" cy="17" r="4"></circle></svg><span>Archetipi</span></a>
      </nav>
      <button type="button" class="filter-toggle-btn" id="matchups-filter-toggle" aria-expanded="false" aria-controls="matchups-filter-panel" aria-label="Filtri">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
      </button>
    </div>
  </div>
  <!-- The "?" pop-up's text (js/matchups-page.js opens it via js/info-dialog.js). -->
  <template id="matchups-help-text">
    <p>La matchup matrix mostra, per ogni coppia di comandanti, la percentuale di vittorie dell&rsquo;uno contro l&rsquo;altro nelle partite gi&agrave; giocate tra loro.</p>
    <p>Si legge per riga: la percentuale &egrave; la vittoria del comandante di riga contro quello di colonna. Sotto, il suo risultato in vittorie-sconfitte-pareggi (V-S-P).</p>
  </template>
  <div class="filter-panel is-collapsed" id="matchups-filter-panel">
    <div class="filter-panel-clip">
      <div class="filter-panel-body">
        <div class="filter-bar">
          <div class="field">
            <label for="matchups-league-filter">Lega</label>
            <select id="matchups-league-filter"><option value="">Tutte le leghe</option></select>
          </div>
          <div class="field">
            <label for="matchups-event-filter">Evento</label>
            <select id="matchups-event-filter"><option value="">Tutti gli eventi</option></select>
          </div>
          <div class="field">
            <label for="matchups-date-from">Dal</label>
            <input type="date" id="matchups-date-from" placeholder="Dal" data-open-on-today>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="page-loading-region">
    <div id="page-loading-overlay" class="page-loading-overlay">
      <div class="sk-page is-matchups" aria-hidden="true">
        <div class="sk-toolbar"><i class="sk sk-title"></i><i class="sk sk-search"></i></div>
        <i class="sk sk-matrix"></i>
        <i class="sk sk-matrix-button sk-touch-only"></i>
      </div>
      <p>Caricamento...</p>
    </div>

    <div class="matchups-toolbar">
      <h2 id="matchups-mode-title">Comandanti pi&ugrave; giocati</h2>
      <button type="button" class="btn-secondary" id="matchups-custom-btn">Crea tabella personalizzata</button>
    </div>

    <div class="card matchups-picker-card" id="matchups-picker-card" hidden>
      <div class="matchups-picker-head">
        <div class="field matchups-typeahead" style="margin-bottom:0;">
          <label for="matchups-search">Cerca comandante</label>
          <input type="search" id="matchups-search" placeholder="Nome comandante..." autocomplete="off" role="combobox" aria-expanded="false" aria-controls="matchups-dropdown">
          <div class="matchups-dropdown" id="matchups-dropdown" role="listbox" hidden></div>
        </div>
        <span class="matchups-count" id="matchups-count">0 / 10 selezionati</span>
      </div>
      <div class="matchups-selected-list" id="matchups-selected-list"></div>
    </div>

    <div id="matchups-matrix"></div>
  </div>
</main>

      </a>
    </div>
  </div>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Cambia tema"></button>
</footer>
<!-- /shell:footer -->

</body>
</html>
