<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("nav-mobile");
      } catch (e) {}
    })();
  </script>

            <input type="search" id="site-search-input" class="site-search-input" placeholder="Cerca giocatori, eventi, &hellip;" aria-label="Cerca nel sito" autocomplete="off">

<main class="page-main" id="player-content">
  <div class="page-loading-region">
    <div id="page-loading-overlay" class="page-loading-overlay"><p>Caricamento...</p></div>

    <!-- The hero, like account.html's profile one (styles.css .profile-hero):
         the player card on the left when its owner shows one
         (js/player-card.js; else the text takes the whole width), on the
         blurred art of the card's background — or of the player's most played
         commander; the name and the numbers on the right
         (js/player-detail.js). -->
    <!-- The hero, and "‹ back to the list" on its top edge (desktop:
         half on the hero, half on the page, over the card's column; phones:
         inside it at the top left) — outside the hero, which clips what's
         inside it. -->
    <div class="detail-hero-wrap">
      <a class="detail-hero-back" href="players.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Giocatori</a>
      <section class="profile-hero detail-hero is-no-card" id="player-hero">
        <div class="profile-hero-art" id="player-hero-art" aria-hidden="true"></div>
        <div class="profile-hero-inner">
          <div class="profile-card-col detail-hero-card" id="player-page-card" hidden></div>
          <div class="profile-hero-text">
            <div class="profile-hero-heading">
              <h1 class="profile-hero-name" id="player-title">Caricamento...</h1>
            </div>
            <div class="profile-hero-stats">
              <div class="profile-stats-tiles" id="player-winrate-overall"></div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Desktop: Album comandanti left, Storico partite (a scrolling list of
         sub-cards, exactly as tall as the album beside it) right; phones:
         the album first, then the matches (styles.css .history-grid). -->
    <div class="history-grid">
      <section class="album-col">
        <h2 class="heading-help">Album comandanti <button type="button" class="help-toggle-btn" id="album-help" aria-haspopup="dialog" aria-label="Come si ottiene una carta speciale">?</button></h2>
        <div id="player-commanders" class="page-loading">Caricamento...</div>
      </section>
      <section class="history-col fills-row">
        <h2>Storico partite <span class="history-count" id="player-matches-count"></span></h2>
        <div id="player-matches" class="page-loading">Caricamento...</div>
      </section>
    </div>
  </div>
</main>
