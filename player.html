  <!-- shell:theme (partials/theme.html — scripts/sync-shell.py) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("nav-mobile", "app-header");
        // English (js/language.js): set before the first paint, and the
        // translation (js/i18n-en.js) loaded at once, so the page is put on
        // screen in English. Not the admin, which stays Italian.
        if (localStorage.getItem("lang") === "en" && location.pathname.indexOf("/admin/") < 0) {
          document.documentElement.lang = "en";
          document.write('<script src="js/i18n-en.js"><\/script>');
        }
      } catch (e) {}
    })();
  </script>

    <!-- The hero, like account.html's profile one (styles.css .profile-hero):
         the player card on the left when its owner shows one
         (js/player-card.js; else the text takes the whole width), on the
         blurred art of the card's background — or of the player's most played
         commander; the name and the numbers on the right
         (js/player-detail.js). -->
    <!-- The hero, and "‹ back to the list" on its top edge (desktop:
         half on the hero, half on the page, over the card's column; phones:
         inside it at the top left) — outside the hero, which clips what's
         inside it. -->
    <div class="detail-hero-wrap">
      <a class="detail-hero-back" href="players.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Giocatori</a>

        <div class="profile-hero-inner">
          <div class="profile-card-col detail-hero-card" id="player-page-card" hidden></div>
          <div class="profile-hero-text">

              <!-- The name on one line (fitted to it), the badges beside it
                   while there's room, else on the next line (styles.css). -->
              <div class="detail-hero-title-wrap">

    <!-- Phones / tablets: the page's content as a sheet sliding up over the hero (styles.css .hero-sheet; on a computer it's no box at all). -->

    <!-- Dal vivo / Online / Tutto (js/where-filter.js — the page's own
         choice, Dal vivo to start with): which of the player's events the
         numbers, the album and the history count. Only for a player with
         both live and online events. Here, at the top of the sheet, on
         touch screens (the sheet's width, like the Meta pages'); elsewhere
         moved into the hero, between the name and the numbers, by
         js/player-detail.js (css/6). -->
    <div class="where-filter" role="radiogroup" aria-label="Dove" hidden>
      <button type="button" class="where-opt is-active" data-where="live" role="radio" aria-checked="true"><span class="where-lotus" aria-hidden="true"></span><span>Dal vivo</span></button>
      <button type="button" class="where-opt" data-where="online" role="radio" aria-checked="false"><svg viewBox="11 9 42 46" aria-hidden="true"><path d="M32 11 L49 28 L32 45 L15 28 Z" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"></path><path d="M32 21 L38 28 L32 35 L26 28 Z" fill="currentColor"></path><rect x="13" y="49" width="38" height="4.4" rx="2.2" fill="currentColor"></rect></svg><span>Online</span></button>
      <button type="button" class="where-opt" data-where="all" role="radio" aria-checked="false"><span>Tutto</span></button>
    </div>

    <!-- The league recap (js/player-league-recap.js): the league in progress,
         else the latest finished one, for this player — hidden until known,
         and when there's no league. -->
    <section class="league-recap" id="player-league-recap" aria-label="Lega" hidden></section>

         Obiettivi · Statistiche · Storico partite (styles.css

      <button type="button" class="profile-tab" role="tab" id="player-tab-stats" data-tab="player-col-stats" aria-controls="player-col-stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg><span>Statistiche</span></button>
      <button type="button" class="profile-tab" role="tab" id="player-tab-matches" data-tab="player-col-matches" aria-controls="player-col-matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"></path><path d="m13 19 6-6M16 16l4 4M19 21l2-2"></path><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"></path><path d="m5 14 4 4M7 17l-3 3M3 19l2 2"></path></svg><span>Storico partite</span></button>
    </nav>
    <div class="history-grid player-lists">
      <!-- On a computer (880px+) two stacks: the Album then Obiettivi,
           Statistiche then Storico partite (css/3 .player-stack;
           dissolved on touch screens and narrower). -->
      <div class="player-stack">
        <section class="album-col" id="player-col-album" role="tabpanel" aria-labelledby="player-tab-album">
