<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <title>Comandanti - Duel Commander Piacenza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <link rel="icon" type="image/png" href="dc_pc.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-active-nav="commanders">

<header class="site-header">
  <a class="site-header-brand" href="index.html">
    <img src="dc_pc.png" alt="" class="site-logo-sm">
    <span>Duel Commander Piacenza</span>
  </a>
</header>

<nav class="site-nav" aria-label="Navigazione principale">
  <div class="site-nav-inner">
    <a class="nav-link" data-nav="current" href="index.html">In corso</a>
    <a class="nav-link" data-nav="leagues" href="leagues.html">Leghe</a>
    <a class="nav-link" data-nav="events" href="events.html">Eventi</a>
    <a class="nav-link" data-nav="players" href="players.html">Giocatori</a>
    <a class="nav-link" data-nav="commanders" href="commanders.html">Comandanti</a>
    <a class="nav-link" data-nav="archetypes" href="archetypes.html">Archetipi</a>
    <a class="nav-link" data-nav="social" href="social.html">Social</a>
  </div>
</nav>

<main class="page-main">
  <div class="page-heading"><h1>Comandanti</h1></div>

  <div class="filter-bar">
    <div class="field">
      <label for="commanders-league-filter">Lega</label>
      <select id="commanders-league-filter"><option value="">Tutte le leghe</option></select>
    </div>
    <div class="field">
      <label for="commanders-event-filter">Evento</label>
      <select id="commanders-event-filter"><option value="">Tutti gli eventi</option></select>
    </div>
    <div class="field">
      <label for="commanders-date-from">Dal</label>
      <input type="date" id="commanders-date-from">
    </div>
    <div class="field">
      <label for="commanders-sort">Ordina per</label>
      <select id="commanders-sort">
        <option value="played">Giocato</option>
        <option value="winrate">Winrate</option>
        <option value="wins">Vittorie</option>
      </select>
    </div>
    <div class="field">
      <label for="commanders-search">Cerca</label>
      <input type="search" id="commanders-search" placeholder="Nome comandante...">
    </div>
  </div>

  <div id="commanders-list">
    <p class="page-loading">Caricamento comandanti...</p>
  </div>
</main>

<footer>
  <div class="footer-spacer" aria-hidden="true"></div>
  <div class="footer-center">
    <div>&copy; 2026 Duel Commander Piacenza</div>
    <div class="footer-credit">
      Creato da Michele Ferri
      <a href="https://www.instagram.com/michele__f/" target="_blank" rel="noopener noreferrer" aria-label="Instagram di Michele Ferri">
        <img src="instagram.png" alt="Instagram" width="16" height="16">
      </a>
    </div>
  </div>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Cambia tema"></button>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/layout.js"></script>
<script type="module" src="js/commanders-page.js"></script>

</body>
</html>
