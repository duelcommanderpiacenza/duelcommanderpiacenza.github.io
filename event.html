<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("nav-mobile");
        if (navigator.maxTouchPoints > 0) document.documentElement.classList.add("app-header");
      } catch (e) {}
    })();
  </script>
  <title>Evento - Duel Commander Piacenza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
  <link rel="icon" type="image/svg+xml" href="dc_pc.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#120d0e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-active-nav="events" class="is-loading">

<header class="site-header">
  <div class="site-header-inner">
    <a class="site-header-brand" href="index.html">
      <img src="dc_pc.svg" alt="" class="site-logo-sm">
      <span>Duel Commander Piacenza</span>
    </a>

    <button type="button" class="site-news" id="site-news" aria-label="Novit&agrave;" title="Novit&agrave;" aria-haspopup="dialog">
      <svg class="site-news-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span class="site-news-badge" hidden></span>
    </button>

    <div class="site-search">
      <button type="button" class="site-search-trigger" id="site-search-trigger" aria-label="Cerca" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>

      <div class="site-search-box" id="site-search-box">
        <div class="site-search-bar">
          <div class="site-search-field">
            <svg class="site-search-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" id="site-search-input" class="site-search-input" placeholder="Cerca giocatori, eventi, &hellip;" aria-label="Cerca nel sito" autocomplete="off">
          </div>
          <button type="button" class="site-search-close" id="site-search-close" aria-label="Chiudi ricerca">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>
          </button>
        </div>
        <div class="site-search-results" id="site-search-results"></div>
      </div>
    </div>

    <a class="site-account" id="site-account" href="account.html" aria-label="Accedi" title="Accedi">
      <svg class="site-account-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
    </a>
  </div>
</header>

<nav class="site-nav" aria-label="Navigazione principale">
  <button type="button" class="nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false"><span class="nav-dropdown-label">Leghe <span class="amp">&amp;</span> Eventi</span><span class="nav-dropdown-caret" aria-hidden="true"></span></button>
  <div class="site-nav-inner">
    <a class="nav-link" data-nav="current" href="index.html">Bacheca</a>
    <a class="nav-link" data-nav="events" href="events.html">Leghe <span class="amp">&amp;</span> Eventi</a>
    <a class="nav-link" data-nav="meta" href="commanders.html">Meta</a>
    <a class="nav-link" data-nav="players" href="players.html">Giocatori</a>
    <a class="nav-link" data-nav="social" href="social.html">Social</a>
  </div>
</nav>

<main class="page-main" id="event-content" data-accent-from-hero data-page="event">
  <div class="page-loading-region">
    <div id="page-loading-overlay" class="page-loading-overlay">
      <div class="sk-page is-hero" aria-hidden="true">
        <div class="sk sk-hero"><div class="sk-hero-text"><i class="sk-hero-title"></i><i class="sk-hero-line"></i><div class="sk-hero-chips"><i></i><i></i><i></i></div></div></div>
        <i class="sk sk-tabs sk-touch-only"></i>
        <div class="sk-cols">
          <div class="sk-col">
            <i class="sk sk-title"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
          </div>
          <div class="sk-col">
            <i class="sk sk-title"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
            <i class="sk sk-row"></i>
          </div>
        </div>
      </div>
      <p>Caricamento...</p>
    </div>

    <!-- The event as a hero, like league.html's (styles.css .profile-hero,
         .event-hero): on the blurred art of the winner's commander, the
         name, the date / league / results links, then the numbers (js/event-detail.js); "‹ Leghe & Eventi" on its top edge
         (.detail-hero-wrap). -->
    <div class="detail-hero-wrap">
      <a class="detail-hero-back" href="events.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Leghe <span class="amp">&amp;</span> Eventi</a>
      <section class="profile-hero detail-hero event-hero is-no-card" id="event-hero">
        <div class="profile-hero-art" id="event-hero-art" aria-hidden="true"></div>
        <div class="profile-hero-inner">
          <div class="profile-hero-text">
            <div class="profile-hero-heading">
              <!-- The results / decklist links right after the name, on the
                   next line when there's no room beside it. -->
              <div class="event-hero-title-row">
                <h1 class="profile-hero-name" id="event-title">Caricamento...</h1>
                <span id="event-results" hidden></span>
              </div>
              <div class="league-hero-meta event-hero-meta">
                <span id="event-meta"></span>
              </div>
            </div>
            <div class="profile-hero-stats">
              <div class="profile-stats-tiles" id="event-stats"></div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Giocatori, Classifica, Partite, Meta: one at a time behind tabs, like
         account.html's (styles.css .profile-tabs / .profile-panel — a pill
         bar, a sticky segmented control on touch screens and phones;
         js/event-detail.js wires them). The lists are sub-cards linking to
         the player (styles.css .history-*). -->
    <nav class="profile-tabs event-tabs" role="tablist" aria-label="Sezioni dell'evento">
      <button type="button" class="profile-tab" role="tab" id="event-tab-entries" data-tab="event-panel-entries" aria-controls="event-panel-entries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>Giocatori</span></button>
      <button type="button" class="profile-tab" role="tab" id="event-tab-leaderboard" data-tab="event-panel-leaderboard" aria-controls="event-panel-leaderboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0Z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg><span>Classifica</span></button>
      <button type="button" class="profile-tab" role="tab" id="event-tab-matches" data-tab="event-panel-matches" aria-controls="event-panel-matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"></path><path d="m13 19 6-6M16 16l4 4M19 21l2-2"></path><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"></path><path d="m5 14 4 4M7 17l-3 3M3 19l2 2"></path></svg><span>Partite</span></button>
      <button type="button" class="profile-tab" role="tab" id="event-tab-meta" data-tab="event-panel-meta" aria-controls="event-panel-meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9Z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15Z"></path></svg><span>Meta</span></button>
    </nav>

    <div class="profile-panels event-panels">
      <section class="profile-panel" id="event-panel-entries" role="tabpanel" aria-labelledby="event-tab-entries">
        <div id="event-entries" class="page-loading">Caricamento...</div>
      </section>
      <section class="profile-panel" id="event-panel-leaderboard" role="tabpanel" aria-labelledby="event-tab-leaderboard">
        <div id="event-leaderboard" class="page-loading">Caricamento...</div>
      </section>
      <section class="profile-panel" id="event-panel-matches" role="tabpanel" aria-labelledby="event-tab-matches">
        <div id="event-matches" class="page-loading">Caricamento...</div>
      </section>
      <!-- Meta: the event's commanders and archetypes as the Bacheca's
           bubble charts, in the same light card and carousel
           (js/event-detail.js renderMeta). -->
      <section class="profile-panel" id="event-panel-meta" role="tabpanel" aria-labelledby="event-tab-meta">
        <div class="card dashboard-card dashboard-card-commanders event-meta-card" id="event-meta-card">
          <div id="event-meta-charts" class="page-loading">Caricamento...</div>
        </div>
      </section>
    </div>
  </div>
</main>

<footer>
  <div class="footer-spacer" aria-hidden="true"></div>
  <div class="footer-center">
    <div>&copy; 2026 Duel Commander Piacenza</div>
    <div class="footer-credit">
      Created by Michele Ferri
      <a href="https://www.instagram.com/michele__f/" target="_blank" rel="noopener noreferrer" aria-label="Instagram di Michele Ferri">
        <img src="instagram.svg" alt="Instagram" width="16" height="16">
      </a>
    </div>
  </div>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Cambia tema"></button>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/layout.js"></script>

</body>
</html>
